<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azyk Books - Find Your Next Favorite Book</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">Azyk Books</div>

        <ul class="nav-links">
          <li><a href="#home">Home</a></li>
          <li><a href="#shop">Shop</a></li>
          <li><a href="#ebook">E-Book</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#cart">My cart</a></li>
        </ul>

        <div class="nav-right">
          <i class="fas fa-search"></i>
          <span>EN <i class="fas fa-chevron-down"></i></span>
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToRJ4RG3u98VSGbDARezZTIuq-MmfBpAR9EA&s"
            alt=""
            width="50"
            class="user-avatar"
          />
        </div>

        <div class="mobile-menu">
          <i class="fas fa-bars" onclick="toggleMenu()"></i>
        </div>
      </nav>
    </header>

    <div class="mobile-nav" id="mobileNav">
      <div class="close-menu">
        <i class="fas fa-close" onclick="toggleMenu()"></i>

        <a href="#home">Home</a>
        <a href="#shop">Shop</a>
        <a href="#ebook">E-Book</a>
        <a href="#about">About</a>
        <a href="#cart">My cart</a>
      </div>
    </div>

    <!-- Hero section -->
    <section class="hero" id="home">
      <div class="hero-text">
        <h1>Find Your <br> Next Book</h1>
        <p>Discover a world where every page brings a new adventure.</p>
        <button class="btn">Explore Now <i class="fas fa-arrow-right"></i></button>
      </div>

      <div class="book-slider-container">
        <div class="book-slider">
          <div class="book-card">
            <img src="https://images.unsplash.com/photo-1543002588-bfa74002ed7e?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
          </div>
          <div class="book-card">
            <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
          </div>
          <div class="book-card">
            <img src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTh8fGJvb2t8ZW58MHx8MHx8fDA%3D" alt="">
          </div>
        </div>
      </div>
    </section>


    <script src="script.js"></script>
  </body>
</html>
